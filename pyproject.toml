[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tsbench"
version = "0.1.0"
description = "Benchmark of language models on Tanabe-Sugano ligand-field tasks under three tool conditions: no tools, a code interpreter, and the TanabeSugano MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anselm Hahn" }]
requires-python = ">=3.12"
dependencies = ["tanabesugano[mcp]==2.0.0", "numpy", "scipy", "matplotlib", "pillow", "jinja2>=3.1.6"]

[project.scripts]
tsbench = "tsbench.cli:main"

[project.optional-dependencies]
test = ["pytest", "pytest-cov", "pytest-xdist", "websockets"]
lint = [
    "pre-commit>=4.7.0",
    "repo-release-tools>=1.18.0",
    "ruff>=0.17.3",
    "ty>=0.0.94",
]
mutation = [
    "mutmut>=3.8",
]
trace = [
    "viztracer>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["tsbench*"]

[tool.setuptools.package-data]
# data is read only through tsbench.core.resource(); the rest are vendored assets, the report page templates and the
# fixtures of the dry-run stand-in for claude
tsbench = ["data/**/*", "_vendor/figura/**/*", "report/templates/*", "run/fake_cli_fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/tsbench/_vendor", "results"]  # vendored code, and the code the models wrote

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# PLW1514 (unspecified-encoding) is a preview rule: only it is enabled, no other preview rules switch on
extend-select = ["PLW1514"]
preview = true
explicit-preview-rules = true

[tool.ruff.format]
quote-style = "double"

