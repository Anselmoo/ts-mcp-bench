# Local git hooks. Install: uv sync --extra lint, then uv run pre-commit install.
# Every hook is repo: local with language: system, so pre-commit builds no hook environment of its own:
# pre-commit, ruff, ty and repo-release-tools come from uv.lock (the lint extra), the rest are tools/ci scripts.
# ty fails on findings that are not in ty-baseline.json; refresh it with uv run --frozen ty check --baseline
# ty-baseline.json --update-baseline only when a finding is accepted.
# gitleaks is a Go binary and not in uv.lock: its hook runs when gitleaks is on PATH and is skipped otherwise.
# No hook tags, releases or bumps: rrt runs only its read-only checks.
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: guard-no-keys
        name: no model credentials in the environment
        entry: bash tools/ci/guard_no_keys.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ruff
        name: ruff check
        entry: uv run --frozen ruff check --force-exclude
        language: system
        types: [python]
        exclude: ^src/tsbench/_vendor/
        stages: [pre-commit]
      - id: ty
        name: ty check
        entry: uv run --frozen ty check --baseline ty-baseline.json
        language: system
        types: [python]
        exclude: ^src/tsbench/_vendor/
        stages: [pre-commit]
      - id: gitleaks
        name: gitleaks on the staged changes
        entry: bash tools/ci/gitleaks_staged.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: rrt-doctor
        name: rrt doctor
        entry: uv run --frozen rrt doctor
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: rrt-eol
        name: rrt eol
        entry: uv run --frozen rrt eol
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: tasks-verify
        name: tsbench tasks verify
        entry: uv run --frozen tsbench tasks verify
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
