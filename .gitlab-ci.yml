# Thin wrapper: every command lives in tools/ci/*.sh so that GitHub Actions can call the same scripts.
# No job may hold model credentials: tools/ci/guard_no_keys.sh fails the job when one is set. All claude calls are the fake (--dry-run).

stages: [lint, test, e2e, gate]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: ghcr.io/astral-sh/uv:python3.13-bookworm-slim
  interruptible: true
  # the uv image has no git; the tests and the release gate need it
  before_script:
    - (apt-get update -qq && apt-get install -y -qq --no-install-recommends git) >/dev/null
  cache:
    key:
      files: [pyproject.toml]
    paths: [.cache/uv]

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

.setup: &setup
  - bash tools/ci/guard_no_keys.sh
  - bash tools/ci/setup.sh

lint:
  stage: lint
  allow_failure: true # report-only: lint findings do not fail the pipeline
  script:
    - bash tools/ci/guard_no_keys.sh
    - (apt-get update -qq && apt-get install -y -qq --no-install-recommends shellcheck) >/dev/null 2>&1 || echo "shellcheck not installed; skipped"
    - bash tools/ci/lint.sh

test:
  stage: test
  script:
    - *setup
    - bash tools/ci/test.sh
  coverage: '/^TOTAL\s+.*\s(\d+(?:\.\d+)?)%$/'
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/ci/reports/]
    reports:
      junit: build/ci/reports/junit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: build/ci/reports/coverage.xml

browser:
  stage: test
  script:
    - *setup
    - bash tools/ci/browser.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths: [build/ci/reports/]
    reports:
      junit: build/ci/reports/junit-browser.xml

e2e-dry:
  stage: e2e
  script:
    - *setup
    - bash tools/ci/e2e_dry.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - build/ci/e2e/runs/report.html
      - build/ci/e2e/runs/views/
      - build/ci/e2e/runs/MANIFEST.json
      - build/ci/e2e/runs/hypotheses.json
      - build/ci/e2e/runs/rates.csv
      - build/ci/e2e/runs/scores.csv
      - build/ci/e2e/plan/

readme-smoke:
  stage: e2e
  script:
    - *setup
    - bash tools/ci/readme_smoke.sh

no-pilot:
  stage: gate
  needs: []
  script:
    - *setup
    - bash tools/ci/gate_no_pilot.sh

confirmatory-guard:
  stage: gate
  needs: []
  script:
    - *setup
    - bash tools/ci/gate_confirmatory.sh

gitleaks:
  stage: gate
  needs: []
  image:
    name: zricethezav/gitleaks:v8.30.1
    entrypoint: [""]
  variables:
    GIT_DEPTH: "0"
  cache: []
  before_script:
    - apk add --no-cache bash >/dev/null 2>&1 || true
  script:
    - bash tools/ci/gitleaks.sh
