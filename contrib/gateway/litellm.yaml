# LiteLLM gateway (an OpenAI-compatible gateway): translates Claude Code's Anthropic Messages API to the
# OpenAI-compatible endpoint below, so `claude -p` can drive its models.
# Secrets come from the environment only (see .env.example). Never commit a key.
#
# Start:  litellm --config litellm.yaml --host 127.0.0.1 --port 4000
# Use:    ANTHROPIC_BASE_URL=http://localhost:4000 \
#         ANTHROPIC_AUTH_TOKEN=$LITELLM_MASTER_KEY \
#         claude -p --model gwdg-qwen3.5-397b ...
#         (unset ANTHROPIC_API_KEY first: in -p mode it always wins)
#
# The model list comes from `GET https://chat-ai.academiccloud.de/v1/models`. Only models that returned TOOL_CALL in
# smoke_tool_calling.py are listed.
# Relayed Claude or GPT models, if the endpoint lists any, are external providers: exploratory at most, never in the
# size ladder. All rows are exploratory: the gateway has no effort control.

model_list:
  # Size ladder within one open-weight family (Qwen): mirrors Haiku / Sonnet / Opus.
  # qwen3-30b-a3b-instruct-2507 (instruct) and qwen3.5-397b-a17b (emits 'thought')
  # serve as the instruct-vs-thinking analogue of the effort sweep.
  - model_name: gwdg-qwen3-30b-a3b-instruct
    litellm_params:
      model: openai/qwen3-30b-a3b-instruct-2507
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  - model_name: gwdg-qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  - model_name: gwdg-qwen3.6-35b-a3b
    litellm_params:
      model: openai/qwen3.6-35b-a3b
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  - model_name: gwdg-qwen3.5-397b
    litellm_params:
      model: openai/qwen3.5-397b-a17b
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  # Second vendor families
  - model_name: gwdg-glm-5.3-flash
    litellm_params:
      model: openai/glm-5.3-flash
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  - model_name: gwdg-gemma-4-31b
    litellm_params:
      model: openai/gemma-4-31b-it
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  - model_name: gwdg-qwen3-coder-next
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY
  # Floor: small model, expected to fail without tools. It may pass numbers as strings in a tool call;
  # classify tool-format errors separately from wrong answers.
  - model_name: gwdg-llama-3.1-8b
    litellm_params:
      model: openai/meta-llama-3.1-8b-instruct
      api_base: https://chat-ai.academiccloud.de/v1
      api_key: os.environ/GWDG_API_KEY

litellm_settings:
  drop_params: true   # the endpoint rejects Anthropic-only params; record this setting with the run

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
